
steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build','-t','gcr.io/$PROJECT_ID/pgvms:$COMMIT_SHA','.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push','gcr.io/$PROJECT_ID/pgvms:$COMMIT_SHA']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'pgvms'
    - '--image'
    - 'gcr.io/$PROJECT_ID/pgvms:$COMMIT_SHA'
    - '--region'
    - '$REGION'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
images:
- 'gcr.io/$PROJECT_ID/pgvms:$COMMIT_SHA'
