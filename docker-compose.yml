version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pgvms-postgres
    environment:
      POSTGRES_DB: pgvms
      POSTGRES_USER: pgvms_user
      POSTGRES_PASSWORD: pgvms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgvms_user -d pgvms"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pgvms-backend
    environment:
      DATABASE_URL: postgres://pgvms_user:pgvms_password@db:5432/pgvms?sslmode=disable
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MIGRATE_ON_START: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./infra/migrations:/app/infra/migrations:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pgvms-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
